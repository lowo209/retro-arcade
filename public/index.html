<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Pick a game and play inside your arcade cabinet.">
  <meta name="theme-color" content="#080c0d">
  <title>Retro Arcade</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/arcade.css">
  <script type="module" src="/app.js"></script>
</head>
<body class="arcade-site" data-view="attract" data-crt="on">
  <a class="skip-link" href="#enter-arcade">Skip to Start</a>
  <main id="main" class="arcade-room">
    <div class="room-atmosphere" aria-hidden="true"><i></i><i></i><i></i><div class="room-floor"></div></div>
    <section id="arcade-cabinet" class="machine-stage" aria-label="Interactive arcade machine">
      <div class="cabinet-viewport"><img class="cabinet-fallback" src="/assets/arcade-fallback.svg" alt="Retro Arcade machine with a glowing screen, joystick and arcade buttons" width="560" height="520"></div>
      <div class="attract-start"><button id="enter-arcade" class="machine-start" data-cabinet-control="start" type="button">Start</button></div>
      <p data-cabinet-status class="sr-only" role="status" aria-live="polite">Start the arcade.</p>
    </section>

    <section id="cabinet-screen" class="crt-overlay" aria-label="Arcade screen" tabindex="-1" hidden>
      <div class="crt-glass" aria-hidden="true"></div>
      <div class="screen-system-bar"><span class="screen-wordmark">R<span>↗</span> <b>ARCADE</b></span><span class="system-signal sr-only"><i></i><span id="system-label">READY</span></span><div class="screen-system-actions"><button id="open-search" class="screen-icon" type="button" aria-label="Search games">⌕</button><button id="open-menu" class="screen-icon" type="button" aria-label="Open settings" aria-controls="arcade-menu" aria-expanded="false">☰</button><button id="leave-arcade" class="screen-icon power-icon" type="button" aria-label="Return to the arcade machine">⏻</button></div></div>
      <div id="browser-panel" class="cabinet-browser">
        <div class="browser-heading"><div><h1>GAMES<span>.</span></h1></div><div class="selection-counter"><span id="selection-position">01</span><i>/</i><span id="selection-total">08</span></div></div>
        <div class="screen-filters" role="group" aria-label="Filter games"><button type="button" data-filter="all" aria-pressed="true" class="is-active">ALL</button><button type="button" data-filter="recent" aria-pressed="false">RECENT</button><button type="button" data-filter="favorites" aria-pressed="false">FAVORITES <span id="favorites-count">0</span></button><button type="button" data-filter="Arcade" aria-pressed="false">ARCADE</button><button type="button" data-filter="PlayStation" aria-pressed="false">PS1</button></div>
        <div class="game-carousel" id="game-carousel"><div class="selection-axis" aria-hidden="true"></div><button type="button" id="previous-game" class="carousel-arrow previous" aria-label="Previous game">‹</button><div id="game-rail" class="game-rail" role="list" aria-label="Game collection" tabindex="0"></div><button type="button" id="next-game" class="carousel-arrow next" aria-label="Next game">›</button><div id="empty-results" class="screen-empty" hidden><span aria-hidden="true">⌁</span><strong>NO GAMES</strong><p id="empty-message">No games in this selection.</p><button id="clear-filters" type="button">SHOW ALL ↗</button></div></div>
        <div class="selected-game" id="selected-game"><div class="selected-copy"><div id="selected-meta" class="selected-meta"></div><h2 id="selected-title">LOADING…</h2></div><div class="selected-actions"><button type="button" id="toggle-favorite" class="favorite-key" aria-label="Add selected game to favorites" aria-pressed="false">♡</button><button type="button" id="selected-info" class="info-key" aria-label="Game details and disc options">i</button><button type="button" id="launch-game" class="launch-key" disabled><span id="launch-label">LOADING</span><span aria-hidden="true">▶</span></button></div></div>
        <div class="screen-footer"><span class="browse-instruction" aria-label="Arrow keys browse; Enter plays"><kbd>←</kbd><kbd>→</kbd><span class="instruction-divider">/</span><kbd>↵</kbd> PLAY</span><span id="library-status" class="sr-only" role="status">Loading games…</span><button id="browse-controls" type="button">SETTINGS <span>↗</span></button></div>
      </div>
      <div id="session-container" hidden></div>
      <section id="arcade-menu" class="arcade-menu" role="dialog" aria-modal="true" aria-labelledby="menu-title" tabindex="-1" hidden>
        <div class="menu-header"><div><h2 id="menu-title">SETTINGS</h2></div><button id="close-menu" class="screen-icon" type="button" aria-label="Close arcade menu">×</button></div>
        <div class="menu-layout"><nav class="menu-tabs" aria-label="Arcade menu"><button type="button" data-menu-tab="library" class="is-active" aria-pressed="true">COLLECTION</button><button type="button" data-menu-tab="settings" aria-pressed="false">SETTINGS</button><a href="https://github.com/lowo209/retro-arcade#readme" target="_blank" rel="noopener noreferrer">GITHUB ↗</a></nav><div id="menu-content" class="menu-content"></div></div>
        <div class="menu-footer"><span>ESC</span><button id="menu-resume" type="button">BACK ↗</button></div>
      </section>
      <p id="arcade-feedback" class="screen-toast" role="status" aria-live="polite" hidden></p>
    </section>
    <noscript><div class="no-script"><h1>THIS CABINET NEEDS JAVASCRIPT.</h1><p>Enable JavaScript, then press Start to browse and play.</p></div></noscript>
  </main>
</body>
</html>

name: Tester feedback
description: Report a website or game problem, or suggest an improvement.
title: '[Tester feedback]: '
body:
  - type: markdown
    attributes:
      value: 'Test available games from the public library. Multiplayer uses the same device; GT4 is not available yet. Include the player error message if a download or launch fails.'
  - type: dropdown
    id: area
    attributes:
      label: What were you testing?
      options:
        - Website, library or cabinet
        - Game download or startup
        - Gameplay or performance
        - Audio
        - Same-device multiplayer
        - Keyboard, gamepad or touch controls
        - Saves or loading progress
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: Library, cabinet, or the game page URL
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game and mode
      description: For game problems, include the title and mode. For GT2, say Arcade or Simulation.
      placeholder: Gran Turismo 2 Arcade, two-player race
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox on Windows, Safari on iPhone, etc.
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: What happened or what would you improve?
      description: Include steps, what you expected, the controls you used, and any useful screenshots or player errors. For multiplayer, describe both players' controllers.
    validations:
      required: true
